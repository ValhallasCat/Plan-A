# Builds the IG in Plan-A/ and publishes Plan-A/output to GitHub Pages on every push to main.
name: Publish IG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Plan-A
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install SUSHI and Jekyll
        run: |
          npm install -g fsh-sushi
          gem install jekyll
      - name: Download IG Publisher
        run: curl -fL --create-dirs -o input-cache/publisher.jar https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar
      - name: Build IG
        run: java -Xmx4g -jar input-cache/publisher.jar -ig .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Plan-A/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
